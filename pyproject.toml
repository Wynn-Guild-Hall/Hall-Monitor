[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hall-monitor"
version = "0.0.1"
description = "Discord bot for the Wynncraft Guild Hall — inter-guild contact platform."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "discord.py>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "tortoise-orm>=0.21",
    "aerich>=0.7",
    "pydantic-settings>=2.5",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.32",
]

[tool.setuptools.packages.find]
where = ["src"]

# Migrations are data, not a package — no `__init__.py`, because Aerich
# discovers version files by walking the directory. Without this they'd be
# left out of the wheel and the container would boot with nothing to apply.
[tool.setuptools.package-data]
"hall_monitor.db" = ["migrations/*/*.py"]

[tool.aerich]
tortoise_orm = "hall_monitor.db.TORTOISE_ORM"
location = "src/hall_monitor/db/migrations"
src_folder = "./src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
